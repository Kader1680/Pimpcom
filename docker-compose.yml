services:
  backend:
    container_name: backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    env_file:
      - ./backend/.env
    depends_on:
      - db

  frontend:
    container_name: frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - backend
     
  db:
    container_name: db
    image: postgres:15.3-alpine
    restart: always
    environment:
      POSTGRES_USER: pimpcom
      POSTGRES_PASSWORD: pimpcom
      POSTGRES_DB: pimpcomdb
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    

volumes:
  db-data: